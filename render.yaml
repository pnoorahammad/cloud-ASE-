services:
  - type: web
    name: sf-rule-manager-backend
    env: node
    buildCommand: "npm install && npm run build"
    startCommand: "npm run start"
    plan: free
    envVars:
      - key: REDIS_URL
        sync: false
      - key: SF_CLIENT_ID
        sync: false
      - key: SF_CLIENT_SECRET
        sync: false
      - key: SF_REDIRECT_URI
        sync: false
      - key: JWT_SECRET
        sync: false
